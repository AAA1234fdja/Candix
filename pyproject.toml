[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candix"
version = "0.1.0"
description = "Authorization-gated red team harness: discovery, verification, exploitation and remediation reporting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Candix"}]
keywords = ["security", "red-team", "pentest", "scanner", "reporting"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = []
optional-dependencies = { windows = ["windows-curses>=2.3"] }

[project.scripts]
candix = "candix.cli.main:main"

[tool.setuptools.packages.find]
include = ["candix*"]
# engine/ and docs/ hold the archived AGPL-3.0 engine, which is never packaged:
# see docs/engine.md
exclude = ["engine*", "docs*", "tests*"]

[tool.setuptools.package-data]
candix = ["_skills/**/SKILL.md", "_skills/**/*.md", "py.typed"]

[tool.setuptools.include-package-data]
# include SKILL.md files inside candix/_skills as package data

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
