services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-candix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-candix} -d ${POSTGRES_DB:-candix}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  candix:
    # Built from this checkout. The previous reference was a third-party
    # namespace whose repository is gone: whoever controls that name could
    # publish the tag this file would pull.
    build:
      context: ..
      dockerfile: engine/Dockerfile
      args:
        CANDIX_ENGINE_VERSION: ${CANDIX_ENGINE_VERSION:-dev}
    image: candix:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CANDIX_ENGINE_PG_DSN: postgres://${POSTGRES_USER:-candix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-candix}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CANDIX_ENGINE_LLM_PROVIDER: ${CANDIX_ENGINE_LLM_PROVIDER:-}
      CANDIX_ENGINE_LLM_MODEL: ${CANDIX_ENGINE_LLM_MODEL:-}
      CANDIX_ENGINE_LLM_BASE_URL: ${CANDIX_ENGINE_LLM_BASE_URL:-}
      CANDIX_ENGINE_LLM_PROXY: ${CANDIX_ENGINE_LLM_PROXY:-}
      CANDIX_ENGINE_JWT_KEY_DIR: /app/keys
      # Optional: key for secrets at rest; empty = keys/secret.key (generated at first start).
      CANDIX_ENGINE_SECRET_KEY: ${CANDIX_ENGINE_SECRET_KEY:-}
      CANDIX_ENGINE_TRUSTED_PROXIES: ${CANDIX_ENGINE_TRUSTED_PROXIES:-}
      # Untrusted-output boundary: on by default (empty = on); CANDIX_ENGINE_UNTRUSTED_BOUNDARY=0 in .env
      # disables it. Cost: about 154 bytes per tool result plus one system note.
      CANDIX_ENGINE_UNTRUSTED_BOUNDARY: ${CANDIX_ENGINE_UNTRUSTED_BOUNDARY:-}
      CANDIX_ENGINE_UPDATE_CHECK: ${CANDIX_ENGINE_UPDATE_CHECK:-}
      # Noise profile for target requests: off (default) | quiet | balanced | aggressive.
      CANDIX_ENGINE_NOISE_PROFILE: ${CANDIX_ENGINE_NOISE_PROFILE:-}
      CANDIX_ENGINE_TARGET_USER_AGENT: ${CANDIX_ENGINE_TARGET_USER_AGENT:-}
      # Hierarchical run budgets: unset or 0 = unlimited (no change). See README.
      CANDIX_ENGINE_TASK_BUDGET_TOKENS: ${CANDIX_ENGINE_TASK_BUDGET_TOKENS:-}
      CANDIX_ENGINE_TASK_BUDGET_TURNS: ${CANDIX_ENGINE_TASK_BUDGET_TURNS:-}
      CANDIX_ENGINE_INTENT_BUDGET_TOKENS: ${CANDIX_ENGINE_INTENT_BUDGET_TOKENS:-}
      CANDIX_ENGINE_INTENT_BUDGET_TURNS: ${CANDIX_ENGINE_INTENT_BUDGET_TURNS:-}
    ports:
      - "${CANDIX_ENGINE_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the runtime data directory (traffic index, task files, transcripts, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # JWT signing key and secret key (jwt.key, secret.key), kept out of data/, which the file manager browses.
      # Persisting it keeps users signed in across container rebuilds.
      - ./keys:/app/keys
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
